minimum_pre_commit_version: "4.2.0"

repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-lint
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: bandit-security
        name: Bandit security scan
        entry: uv run bandit -r backend frontend -c pyproject.toml
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-coverage
        name: Pytest with coverage
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
